// Modify these settings to customize your game

@Kopernicus:BEFORE[OPX-NeidonPlus]
{
    OPX_NeidonPlus_Settings
    {
        UsePseudobodies = True // True or False, defaults to True
        NeidonTextureChange = True // True or False, defaults to True
        ThatmoRevamp = True // True or False, defaults to True
    }
}
//EXPLANATIONS
//UsePseudobodies – defaults to true, adds small optional bodies to fill out the system
//NeidonTextureChange – defaults to true, uses OPX-NeidonPlus's new Neidon texture
//ThatmoRevamp – defaults to true, uses remastered textures for Thatmo
//NisseeRevamp – defaults to true, uses remastered textures for Nissee
