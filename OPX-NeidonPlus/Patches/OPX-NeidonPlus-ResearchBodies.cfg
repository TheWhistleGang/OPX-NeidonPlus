	name = OPX-NeidonPlus
	ONDISCOVERY
	{
		Nito = #LOC_OPX-NP_RB_Nito
        Tito = #LOC_OPX-NP_RB_Tito
        Gryspar = #LOC_OPX-NP_RB_Gryspar
        Hargaladh = #LOC_OPX-NP_RB_Hargaladh
        Chymere = #LOC_OPX-NP_RB_Chymere
        Thatmo = #LOC_OPX-NP_RB_Thatmo
        Nissee = #LOC_OPX-NP_RB_Nissee
        Nyla = #LOC_OPX-NP_RB_Nyla
        Psei = #LOC_OPX-NP_RB_Psei
	}
 	IGNORELEVELS
	{
		Neidon = true false false false
	}
}
RESEARCHBODIES:NEEDS[ResearchBodies,@OPX_NeidonPlus_Settings:HAS[#UsePseudobodies[True]]]
