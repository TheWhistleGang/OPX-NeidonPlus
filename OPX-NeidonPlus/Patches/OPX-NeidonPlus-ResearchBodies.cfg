	{
		I1-Gawyn = #LOC_OPX-NP_RB_Gawyn
		O1-Nentha = #LOC_OPX-NP_RB_OuterPseudobodies
		O2-Paulo = #LOC_OPX-NP_RB_OuterPseudobodies
		O3-Laman = #LOC_OPX-NP_RB_OuterPseudobodies
	}
}
